# Just a bunch of bash variables prefixed with 'dlio_'
# that we can translate into dlio_benchmark command-line options

# the workload name
dlio_workload=resnet50_h100_big

# do not generate data
dlio_generate=False

# do training
dlio_train=True

# do not checkpoint
dlio_checkpoint=False

# use AOS_TARGET as data directory (it should already exist)
dlio_data_dir=${AOS_TARGET}/resnet50-big
