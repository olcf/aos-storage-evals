# AOS_CLIENT_CONFIG sets target model subdir as $AOS_TARGET/model_dir
model_dir=$(basename $dlio_data_dir)

# if on DAOS, update to use local mount path
if [ -n "$AOS_DAOS_LOCAL_MOUNT_TARGET" ]; then
    dlio_data_dir=$AOS_DAOS_LOCAL_MOUNT_TARGET/$model_dir
elif [ -n "$AOS_DAOS_LOCAL_MOUNT_DIR" ]; then
    dlio_data_dir=$AOS_DAOS_LOCAL_MOUNT_DIR/$model_dir
fi

dlio_exe=${AOS_DLIO_EXECUTABLE:-"dlio_benchmark"}
AOS_DLIO_EXECUTABLE="$AOS_REPO_ROOT/scripts/experiment/daos/ioil_wrapper.bash $dlio_exe"
