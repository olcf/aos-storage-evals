# Just a bunch of bash variables prefixed with 'ior_'
# that we can translate into ior config file settings

# calculate per-process number of requests based on desired file and request sizes
nodes=${AOS_CLIENT_NODES:-1}
ppn=${AOS_CLIENT_PROCS_PER_NODE:-1}
per_client_size=$(( $AOS_IO_FILE_SIZE / ($nodes * $ppn) ))
if [ $per_client_size -ge $AOS_IO_REQUEST_SIZE ]; then
    reqs_per_client=$(( $per_client_size / $AOS_IO_REQUEST_SIZE ))
    if [ $reqs_per_client -eq 0 ]; then # underflow, use at least one request
        reqs_per_client=1
    fi
else
    reqs_per_client=1
fi
block_sz=$(( $reqs_per_client * $AOS_IO_REQUEST_SIZE ))

# the target file
ior_testFile=${AOS_TARGET}

# the fio engine to use
ior_api=MPIIO

# whether to keep file after benchmark is run
ior_keepFile=1

# write to test file?
ior_writeFile=1

# read from test file?
ior_readFile=0

# per-client contiguous block size
ior_blockSize=$block_sz

# I/O request size
ior_transferSize=${AOS_IO_REQUEST_SIZE}

# number of segments (a segment contains one block per client)
ior_segmentCount=1
