# Just a bunch of bash variables prefixed with 'ior_'
# that we can translate into ior config file settings

# the ior backend API to use
ior_api=DFS

# the DAOS pool to use
ior_dfs_pool=${AOS_DAOS_POOL}

# the DAOS container to use
ior_dfs_cont=${AOS_DAOS_POSIX_CONTAINER}

# provide path within DAOS container namespace
ior_testFile=${AOS_DAOS_POSIX_CONTAINER_TARGET}
