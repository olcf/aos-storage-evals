# bash configuration for test (source it)
AOS_TEST_NAME=copy
AOS_CLIENT_CONFIG=dataset_copy_large_file.mfu-dcp.cfg
AOS_CLIENT_SOFTWARE=mpifileutils
AOS_CLIENT_SOFTWARE_VERSION=0.12
AOS_CLIENT_PARALLEL=1
AOS_TARGET_CREATE=1

if [ -n "$AOS_SOURCE" ]; then
    if [ -f "$AOS_SOURCE" ]; then
        AOS_IO_FILE_SIZE=$(stat -f '%Dz' $AOS_SOURCE)
    fi
else
    echo "CONFIG ERROR: AOS_SOURCE not set for $AOS_EXPERIMENT_NAME/$AOS_TEST_NAME"
    AOS_CONFIG_ERROR=1
fi

# for large-file parallel copy, need a power-of-2 for ppn to avoid dcp
# complaints about using O_DIRECT with per-process chunk size not being
# a multiple of the request size
AOS_CLIENT_PROCS_PER_NODE=32
