# Just a bunch of bash variables prefixed with 'elbencho_'
# that we can translate into elbencho config file settings

# need to use the libpil4dfs elbencho executable wrappers
elbencho_exe=elbencho.${AOS_PLATFORM_CLIENT}.daos26-pil4dfs
elbencho_scan_exe=elbencho-scan-path.${AOS_PLATFORM_CLIENT}.daos26-pil4dfs

# to force use of pread/pwrite instead of libaio, must use iodepth=1
elbencho_iodepth=1

# if on DAOS, use target location within local mount
if [ -n "$AOS_DAOS_LOCAL_MOUNT_DIR" ]; then
    if [ -n "$AOS_DAOS_LOCAL_MOUNT_TARGET" -a -d $AOS_DAOS_LOCAL_MOUNT_TARGET ]; then
        elbencho_target=$AOS_DAOS_LOCAL_MOUNT_TARGET
    else
        # fio-generated files sit at the root of the container
        elbencho_target=$AOS_DAOS_LOCAL_MOUNT_DIR
    fi
fi
