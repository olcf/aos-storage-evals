# Just a bunch of bash variables prefixed with 'fst_'
# that we can translate into file-stress-test run settings

# do create/write?
fst_create=0

# do read?
fst_read=1

# file size
default_file_size=$(( 32 * $AOS_KIB ))
fst_filesize=${AOS_IO_FILE_SIZE:-$default_file_size}

# number of files per process
default_file_count=1024
fst_filecount=${AOS_IO_FILE_COUNT:-$default_file_count}

# use unique dir
fst_unique=1

# warmup period in seconds
fst_warmup_seconds=30

# benchmark period in seconds
fst_bench_seconds=120
