# bash configuration for test (source it)
AOS_TEST_NAME=read
AOS_CLIENT_CONFIG=dataset_read_uniform_small_files.elbencho.cfg
AOS_CLIENT_SOFTWARE=elbencho
AOS_CLIENT_SOFTWARE_VERSION=3.0.5
AOS_CLIENT_PARALLEL=1

# File size == Block size == I/O request size, which ensures all files are
# fully read in a single I/O request
default_file_size=$(( 32 * $AOS_KIB ))
: ${AOS_IO_FILE_SIZE:=$default_file_size}
: ${AOS_IO_BLOCK_SIZE:=$AOS_IO_FILE_SIZE}
: ${AOS_IO_REQUEST_SIZE:=$AOS_IO_FILE_SIZE}

# elbencho distributed mode only supports one process per node,
# so use PROCS_PER_NODE setting as THREADS_PER_PROC when given
default_num_io_threads=8
if [ -n "$AOS_CLIENT_CPU_SOCKETS_PER_NODE" -a -n "$AOS_CLIENT_CPU_CORES_PER_SOCKET" ]; then
    # use an I/O thread per core
    default_num_io_threads=$(( $AOS_CLIENT_CPU_SOCKETS_PER_NODE * $AOS_CLIENT_CPU_CORES_PER_SOCKET ))
fi
AOS_CLIENT_THREADS_PER_PROC=${AOS_CLIENT_PROCS_PER_NODE:-$default_num_io_threads}
AOS_CLIENT_PROCS_PER_NODE=1

# set depth of I/O request queue
default_io_queue_depth=64
: ${AOS_IO_QUEUE_DEPTH:=$default_io_queue_depth}
