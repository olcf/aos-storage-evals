# Just a bunch of bash variables prefixed with 'elbencho_'
# that we can translate into elbencho config file settings

# config label
elbencho_label=rand_read_uniform_small_files

# read files
elbencho_read=1

# run over dataset multiple iterations
elbencho_iterations=4

# I/O request size
elbencho_block=$AOS_IO_REQUEST_SIZE

# outstanding I/O queue depth (for async engines), also simulates batching
elbencho_iodepth=$AOS_IO_QUEUE_DEPTH

# whether to use O_DIRECT I/O (not available for all targets)
elbencho_direct=${AOS_IO_DIRECT:-0}

# number of I/O threads per server
elbencho_threads=$AOS_CLIENT_THREADS_PER_PROC

# use existing directory structure captured in a treefile
elbencho_treefile=1

# randomize access to files in treefile
elbencho_treerand=1
