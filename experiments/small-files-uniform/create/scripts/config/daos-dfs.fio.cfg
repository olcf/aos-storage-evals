# Just a bunch of bash variables prefixed with 'fio_'
# that we can translate into fio job file settings

# the fio engine to use
fio_ioengine=dfs

# the DAOS pool to use
fio_pool=${AOS_DAOS_POOL:-"aos"}

# the DAOS container to use
fio_cont=${AOS_DAOS_POSIX_CONTAINER:-"posix-default"}

# DAOS libdfs does not support O_DIRECT
fio_direct=0

# fio libdfs backend does not support files not residing at container root
AOS_IO_UNIQUE_DIR=0
fio_directory=$(basename $AOS_TARGET)
