# Just a bunch of bash variables prefixed with 'fio_'
# that we can translate into fio job file settings

# the job name
fio_name=$AOS_TEST_NAME

# the number of I/O threads to run per job
fio_numjobs=$AOS_CLIENT_THREADS_PER_PROC

# the fio engine to use
fio_ioengine=libaio

# whether to use O_DIRECT I/O (not available for all targets)
fio_direct=${AOS_IO_DIRECT:-1}

# fio outstanding I/O queue depth (for async engines)
fio_iodepth=$AOS_IO_QUEUE_DEPTH

# whether to precreate files or create at open
fio_create_on_open=0

# maximum number of files to have open at a time
#fio_openfiles=4096

# fio run mode (write|read|rw|randwrite|randread|randrw)
fio_readwrite=write

# fio file size or range
fio_filesize=$AOS_IO_FILE_SIZE

# fio I/O request size
fio_blocksize=$AOS_IO_REQUEST_SIZE

# number of files per thread
nodes=${AOS_CLIENT_NODES:-1}
fio_nrfiles=$(( $AOS_IO_FILE_COUNT / ($nodes * $AOS_CLIENT_THREADS_PER_PROC) ))

# target directory to hold dataset files
fio_directory=$AOS_TARGET
