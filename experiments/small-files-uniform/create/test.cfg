# bash configuration for test (source it)
AOS_TEST_NAME=create
AOS_CLIENT_CONFIG=dataset_create_uniform_small_files.fio.cfg
AOS_CLIENT_SOFTWARE=fio
AOS_CLIENT_SOFTWARE_VERSION=3.36
AOS_CLIENT_PARALLEL=1
AOS_TARGET_CREATE=1

# set number of files in target dataset
default_file_count=1024
: ${AOS_IO_FILE_COUNT:=$default_file_count}

# File size == Block size == I/O request size
default_file_size=$(( 32 * $AOS_KIB ))
: ${AOS_IO_FILE_SIZE:=$default_file_size}

default_block_size=$AOS_IO_FILE_SIZE
: ${AOS_IO_BLOCK_SIZE:=$default_block_size}

default_write_size=$AOS_IO_FILE_SIZE
: ${AOS_IO_REQUEST_SIZE:=$default_write_size}

# set number of I/O threads per fio process (1 ppn)
default_num_io_threads=8
if [ -n "$AOS_CLIENT_CPU_SOCKETS_PER_NODE" -a -n "$AOS_CLIENT_CPU_CORES_PER_SOCKET" ]; then
    # use an I/O thread per core
    default_num_io_threads=$(( $AOS_CLIENT_CPU_SOCKETS_PER_NODE * $AOS_CLIENT_CPU_CORES_PER_SOCKET ))
fi
: ${AOS_CLIENT_THREADS_PER_PROC:=$default_num_io_threads}
AOS_CLIENT_PROCS_PER_NODE=1

# set depth of I/O request queue
default_io_queue_depth=8
: ${AOS_IO_QUEUE_DEPTH:=$default_io_queue_depth}