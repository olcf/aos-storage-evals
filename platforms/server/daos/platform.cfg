# Locate the DAOS client installation
DAOS_EXE=`which daos`
export AOS_DAOS_INSTALL=$( echo $DAOS_EXE | sed -e 's|/bin/daos||' )

# Check AOS_TARGET for DAOS format: daos://pool/container/target
if [[ ${AOS_TARGET} =~ 'daos://' ]]; then
    # strip prefix
    target_location=$( echo $AOS_TARGET | sed -e 's|daos://||' )
    DAOS_POOL=$( echo $target_location | awk -F'/' '{print $1}' )
    DAOS_CONT=$( echo $target_location | awk -F'/' '{print $2}' )
    DAOS_TARG=$( echo $target_location | sed -e "s|${DAOS_POOL}/${DAOS_CONT}||" )

    # Where to fuse-mount DAOS
    export AOS_DAOS_LOCAL_MOUNT_DIR=/localscratch/aos/$USER/daos/$DAOS_POOL/$DAOS_CONT
    if [ -n "$DAOS_TARG" ]; then
        export AOS_DAOS_LOCAL_MOUNT_TARGET=$AOS_DAOS_LOCAL_MOUNT_DIR/$DAOS_TARG
    fi
fi

# Check AOS_SOURCE for DAOS format: daos://pool/container/source
if [[ ${AOS_SOURCE} =~ 'daos://' ]]; then
    # strip prefix
    source_location=$( echo $AOS_SOURCE | sed -e 's|daos://||' )
    DAOS_POOL=$( echo $source_location | awk -F'/' '{print $1}' )
    DAOS_CONT=$( echo $source_location | awk -F'/' '{print $2}' )
    DAOS_SRC=$( echo $source_location | sed -e "s|${DAOS_POOL}/${DAOS_CONT}||" )

    # Where to fuse-mount DAOS
    export AOS_DAOS_LOCAL_MOUNT_DIR=/localscratch/aos/$USER/daos/$DAOS_POOL/$DAOS_CONT
    if [ -n "$DAOS_SRC" ]; then
        export AOS_DAOS_LOCAL_MOUNT_SOURCE=$AOS_DAOS_LOCAL_MOUNT_DIR/$DAOS_SRC
    fi
fi

if [ -n "$AOS_DAOS_LOCAL_MOUNT_DIR" ]; then
    export AOS_TEST_RUN_INIT_COMMANDS+=("$AOS_REPO_ROOT/scripts/experiment/daos/mount_daos_on_all_job_nodes.bash")
    export AOS_TEST_RUN_FINI_COMMANDS+=("$AOS_REPO_ROOT/scripts/experiment/daos/unmount_daos_on_all_job_nodes.bash")
fi

export AOS_DAOS_POOL=${DAOS_POOL:-"aos"}
export AOS_DAOS_POSIX_CONTAINER=${DAOS_CONT:-"posix-default"}
export AOS_DAOS_POSIX_CONTAINER_SOURCE=${DAOS_SRC:-$AOS_SOURCE}
export AOS_DAOS_POSIX_CONTAINER_TARGET=${DAOS_TARG:-$AOS_TARGET}
