export PATH=$AOS_PROJECT_DIR/x86_64/bin:$PATH
export LD_LIBRARY_PATH=$AOS_PROJECT_DIR/x86_64/lib:$AOS_PROJECT_DIR/x86_64/lib64:$LD_LIBRARY_PATH
export AOS_FIO_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/fio.quokka.daos26
export AOS_FST_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/file-stress-test.quokka.ompi
export AOS_IOR_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/ior.quokka.ompi-daos26
export AOS_ELBENCHO_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/elbencho
export AOS_MFU_DCP_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/dcp.quokka.ompi-daos26
export AOS_MFU_DRM_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/drm.quokka.ompi-daos26
export AOS_MFU_DSYNC_EXECUTABLE=$AOS_PROJECT_DIR/x86_64/bin/dsync.quokka.ompi-daos26

MPI_ROOT=/usr/mpi/gcc/openmpi-4.1.7rc1
export PATH=$MPI_ROOT/bin:$PATH
export LD_LIBRARY_PATH=$MPI_ROOT/lib64:$LD_LIBRARY_PATH
export AOS_CLIENT_MPI=openmpi

# Quokka nodes contain dual 24-core Intel Xeon Gold 5418Y processors, with 2 hyperthreads per core
export AOS_CLIENT_CPU_SOCKETS_PER_NODE=2
export AOS_CLIENT_CPU_CORES_PER_SOCKET=24
export AOS_CLIENT_CPU_HWT_PER_CORE=2
